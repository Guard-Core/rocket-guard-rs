name: Bug report
description: Rocket Guard does not behave as documented
title: "[BUG] "
labels: [bug]
body:
  - type: input
    id: value
    attributes:
      label: Value this delivers
      description: One sentence a user could witness once this is fixed.
      placeholder: "Requests whose JSON body contains a URL are no longer flagged when body scanning is off."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Error messages, panics and logs go here.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure Rocket Guard with '...'
        2. Send a request to '...'
        3. See error
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: rocket-guard-rs version, Rust version, rocket version, OS.
      placeholder: "rocket-guard-rs 1.2.0, rustc 1.95.0, rocket 0.5, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your config with secrets masked.
      render: rust
      placeholder: |
        // Minimal setup that reproduces the issue (secrets masked)
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Production or development, consistent or intermittent, workarounds tried.
