name: Security Audit

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, Monday morning UTC: catch advisories published after the last push.
    - cron: '0 6 * * 1'

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo deny resolves the whole workspace graph, which includes the
      # sibling path dependency, so the engine must be checked out first
      # (same tradeoff and comment as ci.yml).
      # TEMPORARY companion pin: the engine moves from chrono to jiff on
      # fix/rustsec-actix-2026-11 (guard-core-rs PR 184). Reset this ref to
      # master after the train merges.
      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Merged as rennf93/guard-core-rs#22; tracks master.
          repository: Guard-Core/guard-core-rs
          ref: fix/rustsec-actix-2026-11
          path: core-checkout
          persist-credentials: false

      # TEMPORARY companion pin: guard-agent-rs moves from chrono to jiff on
      # fix/chrono-to-jiff together with the engine. Reset this ref to master
      # after the train merges.
      - name: Checkout guard-agent-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-agent-rs
          ref: fix/chrono-to-jiff
          path: agent-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: |
          mv core-checkout ../guard-core-rs
          mv agent-checkout ../guard-agent-rs

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check
