name: Release Gate

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test at tag (${{ matrix.rust }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust: ['stable', '1.92.0']
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Moving branch, same tradeoff as ci.yml: the dependency is a sibling
      # path checkout, so the tag gate rebuilds against a fresh master
      # checkout (which carries the matching engine release).
      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          rustflags: ""

      # The engine's ReDoS validator spawns the pattern-probe child over the
      # workspace target dir, and cargo test does not build dependency bins -
      # without this the user-agent patterns fail secure at the tag (the
      # guard-core-rs 4ab7f95 fix, adapter side; ci.yml already carries it).
      - name: Build the pattern-probe child
        run: cargo build -p guard-core-engine --bins

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  tag-consistency:
    name: Tag matches crate version
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo metadata resolves the sibling path dependency, so it must be
      # checked out before the version can be read (same as the test job).
      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      # Publishing is automated: the publish job below runs on GitHub
      # release creation. This tag/version consistency gate remains the
      # cheap check that the tag matches the published crate version.
      - name: Verify tag equals the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rocket-guard-rs") | .version')
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match crate version $version"
            exit 1
          fi
          echo "ok: tag v$tag matches crate version $version"

  publish:
    name: Publish to crates.io
    needs: tag-consistency
    # Trusted publishing (crates.io enforces it for this crate): the job
    # exchanges the Actions OIDC token via id-token: write. workflow_dispatch
    # is allowed so a publish can be re-driven after a partial failure
    # (master's crate version must match the intended release).
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The root workspace (examples included) resolves the sibling path
      # dependency before packaging, so it must be checked out here too.
      # The packaged crate itself ships the registry dependency: packaging
      # strips the path and keeps the version pin, which already exists on
      # crates.io.
      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""

      # crates.io trusted publishing: exchange the workflow's OIDC identity
      # for a short-lived publish token (cargo does not speak OIDC itself).
      - name: Resolve the crates.io publish token (trusted publishing)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # Retried up to 3 times (crates.io transient 5xx). A version already
      # on crates.io (the partial-failure rerun) skips via the registry
      # check, so a re-drive never blocks on the identical-version rejection.
      - name: Publish rocket-guard-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -o pipefail
          tag="${GITHUB_REF_NAME#v}"
          published=$(curl -fsSL -A "rocket-guard-rs release (https://github.com/Guard-Core/rocket-guard-rs)" "https://crates.io/api/v1/crates/rocket-guard-rs" | jq -r .crate.max_version || true)
          if [ "$published" = "$tag" ]; then
            echo "rocket-guard-rs $tag is already on crates.io; skipping"
            exit 0
          fi
          for attempt in 1 2 3; do
            if cargo publish; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "rocket-guard-rs publish failed after 3 attempts"
          exit 1
