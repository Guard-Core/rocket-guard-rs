name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: stable (check, fmt, clippy, test, doc)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Supply-chain tradeoff, deliberate: this pins a MOVING branch of the
      # core engine, not an immutable ref, because the engine has no crates.io
      # release yet. The Cargo.toml dependency is a local path
      # (../guard-core-rs/crates/guard-core-engine) with a documented TODO to
      # switch to the versioned crate once guard-core-rs is tagged. Once the
      # engine publishes, this checkout step drops in favor of the registry.
      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      - name: Install the stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
          rustflags: ""
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build the pattern-probe child
        run: cargo build -p guard-core-engine --bins
      - name: cargo test
        run: cargo test
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  msrv:
    name: msrv 1.92 (check, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The TEMPORARY pin to the engine's feat/body-form-scan-binary-islands
      # branch is history: guard-core-rs merged it, so this checkout tracks
      # master again (and drops for the registry crate once it is tagged).
      # Moving branch, same tradeoff as the stable job above.
      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      - name: Install the MSRV Rust toolchain (1.92)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.92.0
          rustflags: ""
      - name: cargo check
        run: cargo check --all-targets
      - name: Build the pattern-probe child
        run: cargo build -p guard-core-engine --bins
      - name: cargo test
        run: cargo test

  coverage:
    name: coverage (100% lines)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Moving branch, same tradeoff as the stable job above: the engine is
      # a local path dependency until it is tagged.
      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      - name: Install the stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov

      - name: Build the pattern-probe child
        run: cargo build -p guard-core-engine --bins

      # The gate computes line coverage from the lcov export's per-line DA
      # records, not from llvm-cov's summary table. llvm-cov 22's summary
      # aggregation falsely reports missed lines while every line-level view
      # built from the exact same profdata (show text/html, the lcov export,
      # the cobertura export, the JSON segment list, and a faithful
      # reimplementation of LLVM's LineCoverageStats over the exported
      # regions) reports the files fully covered. It reproduces on macOS
      # arm64/x86_64 and ubuntu-latest, survives a clean coverage target dir
      # and codegen-units=1, and persists on the newest available toolchain
      # (cargo-llvm-cov 0.9.1 + rustc 1.99.0's llvm-tools; the 2026-10-07 CI
      # run on the family's tower branch ran exactly that pair and still
      # reported the phantom misses). Root-cause evidence with the
      # side-by-side views:
      # https://github.com/rennf93/tower-guard-rs/pull/35#issuecomment-6038980718
      # The gate keeps the same fail-closed 100%-lines semantics as before:
      # every abnormal export fails the job, nothing is hidden or excluded.
      - name: Generate the line-coverage export
        env:
          # cargo-llvm-cov compiles into its own target directory, so the
          # test binaries' sibling search cannot see the probe; the env
          # override pins the default-target-dir copy built one step above.
          GUARD_PATTERN_PROBE_BIN: target/debug/guard-pattern-probe
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Enforce 100% line coverage from the export's per-line records
        run: python3 .github/scripts/enforce_line_coverage.py lcov.info

      # Informational only: the summary table still prints for the familiar
      # per-file view, but it must never gate - it carries the known
      # aggregation artifact documented above.
      - name: Print the informational llvm-cov summary
        run: cargo llvm-cov report
