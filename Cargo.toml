[workspace]
members = ["examples/simple_app", "examples/advanced_app"]

[package]
name = "rocket-guard-rs"
version = "1.4.0"
edition = "2024"
rust-version = "1.92"
description = "Application-layer security Fairing for Rocket, powered by the guard-core-rs engine. Part of the guard ecosystem."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rennf93/rocket-guard-rs"
readme = "README.md"
keywords = ["security", "middleware", "api", "rocket", "fairing"]
categories = ["web-programming"]

[lib]
name = "rocket_guard_rs"

[dependencies]
# guard-core-engine is published to crates.io (4.3.1); the path points at the
# engine crate inside a sibling guard-core-rs checkout so local builds and CI
# (see .github/workflows/ci.yml) exercise the engine from source. The version
# pin stays in lockstep with the published engine release.
guard-core-engine = { path = "../guard-core-rs/crates/guard-core-engine", version = "4.3.1" }
# The engine facade (the event bus, observability knobs, the on_block hook,
# custom error responses, and the rate-limit stage the fairing delegates to).
# Path points at the sibling guard-core-rs checkout so local builds and CI
# exercise it from source; the version pin stays in lockstep with the
# published facade release.
guard-core-rs = { path = "../guard-core-rs/crates/guard-core-rs", version = "4.3.1" }
rocket = { version = "0.5.1", default-features = false }
rocket_ws = { version = "0.1.1", features = ["tokio-tungstenite"] }

[dev-dependencies]
chrono = "0.4"
# The stage answers (`guard_core_rs::tower::StageResponse`) carry an
# `http::StatusCode`; the adapter tests compose them directly.
http = "1.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
# cargo-llvm-cov sets cfg(coverage) during coverage builds; declare it so the
# cfg(not(coverage)) pairs in the sources stay lint-clean.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
all                     = { level = "deny", priority = -1 }
pedantic                = { level = "warn", priority = -1 }
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
module_name_repetitions = "allow"
